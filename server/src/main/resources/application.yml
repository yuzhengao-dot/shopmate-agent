server:
  port: 8080

shopmate:
  llm:
    # 任意 OpenAI 兼容网关均可：DashScope 兼容模式 / DeepSeek / vLLM / Ollama(OpenAI 兼容)
    base-url: ${SHOPMATE_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${SHOPMATE_LLM_API_KEY:}
    model: ${SHOPMATE_LLM_MODEL:qwen-plus}
    temperature: 0.3

spring:
  datasource:
    url: jdbc:h2:mem:shopmate;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql,classpath:knowledge.sql
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.shopmate.agent: info
    dev.langchain4j: warn